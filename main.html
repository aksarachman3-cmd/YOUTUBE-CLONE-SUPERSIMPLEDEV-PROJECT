<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Youtube Clone</title>
        <link rel="stylesheet" href="config.css">
        <link rel="stylesheet" href="header.css">
    </head>
    <body>
        <!-- Bagian Atas (HEADER) -->
        <header>
            <!-- Terdiri dari Menu Icon dan Youtube Logo -->
            <div class="left-header">
                <div class="menu-icon-container">
                    <img src="src/menu_icon.svg" alt="Menu">
                </div>
                <div class="logo-container">
                    <a href="https://www.youtube.com/" class="youtube-link">
                        <img src="src/youtube_logo.svg" alt="YouTube Home">
                    </a>
                </div>
            </div>

            <!-- Terdiri dari Search Bar, Search Icon, dan Microphone Icon -->
            <div class="middle-header">
                <input type="text" placeholder="Search" class="search-bar">
                <button type="button" class="search-button">
                    <img src="src/search_icon.svg" alt="Search"> 
                </button>
                <button type="button" class="microphone-button">
                    <img src="src/microphone_icon.svg" alt="Search with Voice">
                </button>
            </div>

            <!-- Terdiri dari Create Icon, Youtube App Icon, Notification Icon, dan Profile Picture -->
            <div class="right-header">
                <div class="create-container">
                    <img src="src/create_icon.svg" alt="Create">
                </div>
                <div class="app-container">
                    <img src="src/app_icon.svg" alt="YouTube Apps">
                </div>
                <div class="notification-container">
                    <img src="src/notification_icon.svg" alt="Notifications">
                </div>
                <div class="profile-container">
                    <!-- Pastikan nama file gambarnya sesuai ya, Aksa -->
                    <img src="src/pp_iconjpeg.jpeg" alt="Profile Picture">
                </div>
            </div>
        </header>

        <!-- Bagian Utama Tampilan -->
        <div class="main-section">
            <!-- Menggunakan aside untuk sidebar -->
            <aside class="side-bar">
                <!-- Isi menu nanti di sini -->
            </aside>
            
            <!-- Menggunakan main untuk konten video -->
            <main class="content">
                <!-- Isi card video nanti di sini -->
            </main>
        </div>
    </body>
</html>
